services:
  proxy:
    build: .
    image: sni-dns-proxy
    container_name: sni-dns-proxy
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_PATH: /data/proxy.db
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "80:80/tcp"
      - "443:443/tcp"
      - "8080:8080/tcp"
    volumes:
      - proxy-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  proxy-data:
